# ════════════════════════════════════════════════════════════════
# بنيةُ اختبار التكامل — **تُرمى بالكامل بعد كلّ شوط.**
#
# ★ لماذا قاعدةٌ وريدِسُ مستقلّان لا القائمان:
#   · قاعدةٌ حقيقيّةٌ هي بيتُ القصيد — عطلا اليوم («تاريخٌ خامٌّ في قالب
#     `sql`») مرّا من ١١١٤ اختباراً ساكناً وسقطا عند أوّل استعلامٍ فعليّ.
#   · وريدِسُ **مستقلّ** لا قاعدةٌ منطقيّةٌ في القائم: مهامُّ الاختبار تدخل
#     طوابيرَ بنفس الأسماء (`bot-reply`…)، فلو لامست ريدِس الحيّ لالتقطها
#     عاملُ الإنتاج وردّ على «زبونٍ» لا وجودَ له.
#
# ⚠️ و`tmpfs` لا مجلَّدٌ مسمّى: مجلَّدٌ يبقى يجعل الشوطَ التالي يبدأ على حالةٍ
#    متّسخة، فيمرّ اختبارٌ لأنّ سابقَه ترك صفّاً — وهو أسوأُ من فشلٍ صريح.
#
# ⚠️ ومنفذٌ عشوائيٌّ على 127.0.0.1: منفذٌ ثابتٌ يصطدم بالقاعدة الحيّة على
#    نفس الخادم، ويربط الاختبارَ بها بلا أن يقصد أحد.
#
# يُشغَّل من `test-integration/harness.ts` لا باليد.
# ════════════════════════════════════════════════════════════════
name: aibot-itest

services:
  db:
    # نفسُ صورة الإنتاج: الامتدادُ والإصدارُ جزءٌ ممّا يُختبَر.
    image: pgvector/pgvector:pg16
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_USER: aibot
      POSTGRES_PASSWORD: itest
      POSTGRES_DB: aibot
    ports:
      - "127.0.0.1:0:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibot -d aibot"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # `appendonly no`: لا استمرارَ يُراد هنا، والقرصُ على الخادم ضيّق.
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:0:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
